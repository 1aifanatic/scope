# k3d Cluster Configuration for scope-core
# This configuration creates a lightweight Kubernetes cluster suitable for local development
# The bootstrap script will override the cluster name, registry name, and port mappings
# with worktree-specific values (e.g. scope-22, scope-22-registry.localhost)

apiVersion: k3d.io/v1alpha5
kind: Simple

# Metadata section: defines the cluster identity
metadata:
  name: scope-local  # Default cluster name (bootstrap script will override with worktree-specific name)

# Node configuration: defines the cluster topology
# This creates 1 control plane (server) node and 2 worker (agent) nodes
servers: 1
agents: 2

# Kubernetes API server configuration
kubeAPI:
  hostPort: "6443"  # Port on host machine for API access (bootstrap script will override)

# Port mappings: expose services from cluster to host machine
# These are mapped through the loadbalancer node filter
ports:
  # Portal application service (NGINX frontend)
  - port: 5100:30100
    nodeFilters:
      - loadbalancer
  # API service (backend)
  - port: 3100:30200
    nodeFilters:
      - loadbalancer

# Registry configuration: built-in container registry for the cluster
registries:
  create:
    name: scope-registry.localhost
    host: "0.0.0.0"
    hostPort: "5050"

# Additional options for k3s and k3d behavior
options:
  k3s:
    extraArgs:
      # Disable Traefik ingress controller (we use custom ingress setup)
      - arg: --disable=traefik
        nodeFilters:
          - server:*
