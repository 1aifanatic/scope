# cargo-about configuration for the Rust portion of the repository-root NOTICE.
#
# Scope: the `gateway` binary is redistributed as a Linux (Alpine / musl)
# container image, so licenses are enumerated for the crates that actually
# compile into that target. Dev/test-only crates are not shipped and are
# excluded; build dependencies (proc-macros, etc.) are retained as harmless
# over-attribution.

# Enumerate for the target(s) the shipped binary is built for (Alpine = musl).
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

# Dev/test-only dependencies do not ship in the release binary.
ignore-dev-dependencies = true

# All licenses below are OSI-approved permissive or public-domain-equivalent.
# If a crate ever introduces a copyleft or otherwise non-listed license,
# cargo-about fails here on purpose — the safety net for the OSS release.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
]

# Our own first-party crate carries no license metadata and must not appear in
# the third-party NOTICE (it is marked `publish = false`).
[private]
ignore = true
